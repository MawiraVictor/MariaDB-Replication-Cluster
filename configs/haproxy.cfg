# ---------- MySQL Slave Cluster ----------
frontend mysql_frontend
    bind *:3307
    mode tcp
    option tcplog
    default_backend mysql_slave_backend

backend mysql_slave_backend
    mode tcp
    option mysql-check user haproxy_check
    balance roundrobin
    server slave1 172.20.10.4:3306 check
    server slave2 172.20.10.5:3306 check
